[package]
name = "fractal-search"
version = "0.1.0"
edition = "2021"
default-run = "fractal-search"

[features]
cuda = ["fractal-search-core/cuda"]

[dependencies]
fractal-search-core = { workspace = true, features = ["runtime", "catalog"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
toml = { version = "0.9.8", default-features = false, features = ["std", "parse", "serde"] }
libc = { workspace = true }
url = { workspace = true }
notify = "=8.2.0"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
