[package]
name = "fractal-search"
version = "0.1.0"
edition = "2021"
default-run = "fractal-search"

[features]
cuda = ["fractal-search-core/cuda"]

[dependencies]
fractal-search-core = { path = "../../crates/fractal-search-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
toml = "0.9.8"
libc = "0.2"
url = "2.5"
notify = "=8.2.0"
sha2 = "0.10"
zbus = "=5.12.0"
rmcp = { version = "=3.1.4", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3.23"
