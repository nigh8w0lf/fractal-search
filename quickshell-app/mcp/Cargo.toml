[package]
name = "fractal-search-mcp"
version = "0.1.0"
edition = "2021"

[features]
cuda = ["fractal-search-core/cuda"]

[dependencies]
fractal-search-core = { workspace = true, features = ["runtime", "catalog"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
rmcp = { version = "=3.1.4", default-features = false, features = ["server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
base64 = "0.22"
