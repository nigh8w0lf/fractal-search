[package]
name = "fractal-search-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["runtime", "catalog"]
runtime = ["dep:ort"]
cuda = ["runtime", "ort/cuda", "ort/copy-dylibs"]
media = ["dep:libc"]
catalog = ["media", "dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures", "dep:tokio", "dep:walkdir", "dep:url"]

[dependencies]
anyhow = { workspace = true }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
libheif-rs = { version = "2.6", default-features = false, features = ["image", "v1_20"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-24"], optional = true }
lancedb = { version = "=0.37.1", default-features = false, optional = true }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
futures = { version = "0.3", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
walkdir = { version = "2.5", optional = true }
url = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Omarchy supplies libjpeg-turbo. Choose it explicitly without a bundled CMake
# build or repository-wide environment override.
turbojpeg = { version = "1.1", default-features = false, features = ["pkg-config"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
turbojpeg = "1.1"

[dev-dependencies]
tempfile = { workspace = true }

[[example]]
name = "validate_embeddinggemma2"
required-features = ["runtime"]

[[example]]
name = "validate_cuda"
required-features = ["cuda"]
